<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2dfb5"><meta name="description" content="Sigfly's apps and experiments">
<title>Buckets of Rain · Sigfly</title>
<style>
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2dfb5;color:#181817}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(125deg,#f2dfb5 0%,#f5e9cf 58%,#e5c98c 100%)}a{color:inherit;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:34px 22px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:20px;font-weight:900;letter-spacing:-.7px;text-transform:uppercase}.brand span{color:#e24c2d}.github{border:2px solid #191919;padding:10px 15px;border-radius:3px;font-size:14px;background:#f2dfb5;font-weight:700}.hero{padding:80px 0 46px;position:relative}.hero:before{content:"";position:absolute;right:2%;top:20%;width:100px;height:100px;border-radius:50%;background:#e8b94c;opacity:.65;z-index:-1}.eyebrow{font-size:14px;letter-spacing:2.2px;text-transform:uppercase;color:#b83e27;font-weight:900}.hero h1{font-size:clamp(48px,9vw,92px);letter-spacing:-3.5px;line-height:1.02;margin:18px 0;font-weight:950;text-transform:uppercase}.hero h1 span{color:#e44d2c}.hero p{max-width:540px;color:#1f426a;line-height:1.55;font-size:18px;font-weight:650}.hero p .lyric{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:10px 0 20px;flex-wrap:wrap}.toolbar h2{font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.3px}.search{border:2px solid #191919;border-radius:3px;padding:12px 15px;background:#fff4da;color:#191919;width:min(100%,310px);font-size:15px;outline:none}.search:focus{border-color:#e44d2c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.card{background:#f7ebd0;border:3px solid #171717;border-radius:3px;padding:24px;min-height:220px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #1f426a;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-4px);box-shadow:8px 10px 0 #e44d2c}.symbol{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:#eabf58;color:#1f426a;font-size:25px;margin-bottom:18px}.card h3{margin:0 0 9px;font-size:20px;overflow-wrap:anywhere;text-transform:uppercase}.card p{margin:0 0 22px;color:#474035;line-height:1.5;font-size:14px;flex:1}.visit{color:#b83e27;font-size:14px;font-weight:900}.status{color:#1f426a;background:#f7ebd0;border:2px dashed #1f426a;border-radius:3px;padding:23px;line-height:1.6}.hidden{display:none}footer{margin-top:55px;padding-top:20px;border-top:3px solid #191919;color:#474035;font-size:13px}footer a{text-decoration:underline}@media(max-width:600px){.wrap{padding:24px 18px 45px}.hero{padding:60px 0 35px}.hero h1{letter-spacing:-2px}.search{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="/">sigfly<span>.</span></a><a class="github" href="https://github.com/sigfly" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header>
<section class="hero"><div class="eyebrow">Buckets of Rain</div><h1>Ideas.<br><span>Apps.</span></h1><p><span class="lyric">Little red wagon</span><span class="lyric">Little red bike</span><span class="lyric">I ain't no monkey but I know what I like</span></p></section>
<section aria-label="Projects"><div class="toolbar"><h2>Explore projects <span id="count" style="color:#e44d2c"></span></h2><input id="search" class="search" type="search" placeholder="Search projects…" aria-label="Search projects"></div><div id="grid" class="grid"></div><div id="status" class="status">Finding published projects on GitHub…</div></section>
<footer>Made by Sigfly · Hosted free on <a href="https://pages.github.com/">GitHub Pages</a></footer>
</div>
<script>
const USERNAME='sigfly';
const grid=document.getElementById('grid');
const status=document.getElementById('status');
const count=document.getElementById('count');
const search=document.getElementById('search');
let projects=[];
function createCard(repo){
 const card=document.createElement('a');card.className='card';card.href=repo.homepage;card.target='_blank';card.rel='noopener noreferrer';
 const icon=document.createElement('div');icon.className='symbol';icon.textContent='✦';
 const title=document.createElement('h3');title.textContent=repo.name.replace(/[-_]/g,' ');
 const desc=document.createElement('p');desc.textContent=repo.description||'Explore this app.';
 const link=document.createElement('span');link.className='visit';link.textContent='Open app ↗';
 card.append(icon,title,desc,link);return card;
}
function render(){const q=search.value.trim().toLowerCase();const filtered=projects.filter(p=>(p.name+' '+(p.description||'')).toLowerCase().includes(q));grid.replaceChildren(...filtered.map(createCard));count.textContent=projects.length?'('+filtered.length+')':'';status.classList.toggle('hidden',filtered.length>0);if(!filtered.length)status.textContent=projects.length?'No projects match your search.':'No published project apps found yet. Create another repository and enable GitHub Pages to see it here.';}
search.addEventListener('input',render);
async function load(){try{
 let repos=[];let page=1;
 while(page<=10){const response=await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}&sort=updated`,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error('GitHub API request failed');const batch=await response.json();repos.push(...batch);if(batch.length<100)break;page++;}
 projects=repos.filter(r=>r.has_pages&&!r.archived&&!r.disabled&&!r.fork&&r.name.toLowerCase()!==`${USERNAME}.github.io`)
 .map(r=>({...r,homepage:`https://${USERNAME}.github.io/${encodeURIComponent(r.name)}/`}));
 render();
 }catch(err){status.classList.remove('hidden');status.textContent='Could not load GitHub projects right now. Please try again later (GitHub API rate limits may apply).';}}
load();
</script>
</body></html>
