<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020"><meta name="description" content="Sigfly's apps and experiments">
<title>Sigfly · App Hub</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#edf2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#1c2a55 0%,transparent 45%),#0b1020}a{color:inherit;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:34px 22px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:20px;font-weight:800;letter-spacing:-.7px}.brand span{color:#8aa6ff}.github{border:1px solid #3b4565;padding:10px 15px;border-radius:12px;font-size:14px;background:#171f38}.hero{padding:80px 0 46px}.eyebrow{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:#9fb4ff;font-weight:800}.hero h1{font-size:clamp(40px,8vw,76px);letter-spacing:-3px;line-height:1.06;margin:16px 0}.hero h1 span{color:#91a9ff}.hero p{max-width:540px;color:#acb9d4;line-height:1.7;font-size:17px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:10px 0 20px;flex-wrap:wrap}.toolbar h2{font-size:22px;margin:0}.search{border:1px solid #38435e;border-radius:12px;padding:12px 15px;background:#151d32;color:#fff;width:min(100%,310px);font-size:15px;outline:none}.search:focus{border-color:#8da5ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.card{background:#151e34;border:1px solid #303b59;border-radius:20px;padding:24px;min-height:220px;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-4px);border-color:#8ba3fa}.symbol{display:grid;place-items:center;width:50px;height:50px;border-radius:15px;background:#26365b;font-size:25px;margin-bottom:18px}.card h3{margin:0 0 9px;font-size:20px;overflow-wrap:anywhere}.card p{margin:0 0 22px;color:#aab8d3;line-height:1.5;font-size:14px;flex:1}.visit{color:#9db4ff;font-size:14px;font-weight:700}.status{color:#b3c0db;background:#141d33;border:1px dashed #435170;border-radius:16px;padding:23px;line-height:1.6}.hidden{display:none}footer{margin-top:55px;padding-top:20px;border-top:1px solid #2b3652;color:#8b9bb9;font-size:13px}footer a{text-decoration:underline}@media(max-width:600px){.wrap{padding:24px 18px 45px}.hero{padding:60px 0 35px}.hero h1{letter-spacing:-2px}.search{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="/">sigfly<span>.</span></a><a class="github" href="https://github.com/sigfly" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header>
<section class="hero"><div class="eyebrow">Apps · Tools · Experiments</div><h1>Little ideas.<br><span>Useful apps.</span></h1><p>Welcome to my corner of the internet. Explore the apps and projects I'm building.</p></section>
<section aria-label="Projects"><div class="toolbar"><h2>Explore projects <span id="count" style="color:#8da5ff"></span></h2><input id="search" class="search" type="search" placeholder="Search projects…" aria-label="Search projects"></div><div id="grid" class="grid"></div><div id="status" class="status">Finding published projects on GitHub…</div></section>
<footer>Made by Sigfly · Hosted free on <a href="https://pages.github.com/">GitHub Pages</a></footer>
</div>
<script>
const USERNAME='sigfly';
const grid=document.getElementById('grid');
const status=document.getElementById('status');
const count=document.getElementById('count');
const search=document.getElementById('search');
let projects=[];
function createCard(repo){
 const card=document.createElement('a');card.className='card';card.href=repo.homepage;card.target='_blank';card.rel='noopener noreferrer';
 const icon=document.createElement('div');icon.className='symbol';icon.textContent='✦';
 const title=document.createElement('h3');title.textContent=repo.name.replace(/[-_]/g,' ');
 const desc=document.createElement('p');desc.textContent=repo.description||'Explore this app.';
 const link=document.createElement('span');link.className='visit';link.textContent='Open app ↗';
 card.append(icon,title,desc,link);return card;
}
function render(){const q=search.value.trim().toLowerCase();const filtered=projects.filter(p=>(p.name+' '+(p.description||'')).toLowerCase().includes(q));grid.replaceChildren(...filtered.map(createCard));count.textContent=projects.length?'('+filtered.length+')':'';status.classList.toggle('hidden',filtered.length>0);if(!filtered.length)status.textContent=projects.length?'No projects match your search.':'No published project apps found yet. Create another repository and enable GitHub Pages to see it here.';}
search.addEventListener('input',render);
async function load(){try{
 let repos=[];let page=1;
 while(page<=10){const response=await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}&sort=updated`,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error('GitHub API request failed');const batch=await response.json();repos.push(...batch);if(batch.length<100)break;page++;}
 projects=repos.filter(r=>r.has_pages&&!r.archived&&!r.disabled&&!r.fork&&r.name.toLowerCase()!==`${USERNAME}.github.io`)
 .map(r=>({...r,homepage:`https://${USERNAME}.github.io/${encodeURIComponent(r.name)}/`}));
 render();
 }catch(err){status.classList.remove('hidden');status.textContent='Could not load GitHub projects right now. Please try again later (GitHub API rate limits may apply).';}}
load();
</script>
</body></html>
